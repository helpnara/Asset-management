name: SlowRich
options:
  bundleIdPrefix: com.helpnara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Core:
    path: Packages/Core

targets:
  SlowRich:
    type: application
    platform: iOS
    sources:
      - App
      # 개인정보 명세는 번들에 그대로 들어가야 한다. 소스로 잡히면 안 된다.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Core
        product: Core
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 느린 부자의 기록
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 암호화를 직접 쓰지 않는다. 없으면 TestFlight 에 올릴 때마다
        # 수출 규정 질문에 손으로 답해야 한다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpnara.slowrich
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # 1 = iPhone. iPad 확장 시 "1,2" 로 바꾼다 (로드맵 M7).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  SlowRich:
    build:
      targets:
        SlowRich: all
    run:
      config: Debug
    test:
      config: Debug
