name: SlowRich
options:
  bundleIdPrefix: com.helpnara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Core:
    path: Packages/Core

targets:
  SlowRich:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Core
        product: Core
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 느린 부자의 기록
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpnara.slowrich
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # 1 = iPhone. iPad 확장 시 "1,2" 로 바꾼다 (로드맵 M7).
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  SlowRich:
    build:
      targets:
        SlowRich: all
    run:
      config: Debug
    test:
      config: Debug
