name: SlowRich
options:
  bundleIdPrefix: com.helpnara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Core:
    path: Packages/Core

targets:
  SlowRich:
    type: application
    platform: iOS
    sources:
      # PrivacyInfo.xcprivacy 도 이 glob 이 잡는다. XcodeGen 은 모르는 확장자를
      # 리소스 단계에 넣으므로 번들에 그대로 들어간다. 따로 또 적으면
      # 같은 파일이 두 번 잡혀 "Multiple commands produce" 로 빌드가 깨진다.
      #
      # .entitlements 는 XcodeGen 이 어느 빌드 단계에도 넣지 않으므로
      # 여기 걸려도 번들에 복사되지 않는다. 서명 단계가 경로로만 읽는다.
      - App
    dependencies:
      - package: Core
        product: Core
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 느린 부자의 기록
        # 한국어 전용 앱이다. 이걸 안 박아 두면 기기 언어가 영어일 때
        # 날짜가 "Aug 29, 2026" 으로, DatePicker 같은 시스템 UI 도 영어로 나온다.
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations:
          - ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # CloudKit 이 변경을 알리는 무음 푸시를 받으려면 필요하다.
        UIBackgroundModes:
          - remote-notification
        # 암호화를 직접 쓰지 않는다. 없으면 TestFlight 에 올릴 때마다
        # 수출 규정 질문에 손으로 답해야 한다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpnara.slowrich
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # 1 = iPhone. iPad 확장 시 "1,2" 로 바꾼다 (로드맵 M7).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # aps-environment 는 빌드 구성마다 달라야 한다. Debug 에 production 을
        # 넣으면 개발 프로파일 검증에서, Release 에 development 를 넣으면
        # TestFlight 업로드에서 막힌다. 그래서 파일을 둘로 나눈다.
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/SlowRich.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/SlowRich.Release.entitlements

schemes:
  SlowRich:
    build:
      targets:
        SlowRich: all
    run:
      config: Debug
    test:
      config: Debug
