name: CloudKit 스키마

# 맥 없이 CloudKit 스키마를 다루는 길이다 (docs/06-testflight.md).
#
# 애플의 CKTool JS 는 Node 에서 돌아서 **리눅스 러너로 충분하다** —
# `xcrun cktool` 과 달리 맥이 필요 없다.
#
# ⚠️ **이 워크플로는 Production 에 쓰지 않는다.** 애플이 도구에 그 길을 안 열어
#    뒀다. Development 까지만 하고, Production 승격은 웹 콘솔의 Deploy 버튼을
#    사람이 누른다. 그래서 되돌릴 수 없는 일이 여기서 일어나지 않는다.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "무엇을 할까"
        required: true
        default: read
        type: choice
        options:
          # 먼저 읽는다. 쓰기 전에 지금 무엇이 있는지 본다.
          - read          # 팀 · 컨테이너 목록과 두 환경의 현재 스키마
          - validate      # 스키마 파일 문법만 검사 (쓰지 않는다)
          - apply         # Development 에 적용 (Production 아님)
      container:
        description: "컨테이너 ID"
        required: true
        # read 는 읽기만 하므로 **진짜 컨테이너**가 기본이다 — 우리가 알고 싶은
        # 것이 그쪽이기 때문이다. apply 로 쓸 때는 시험용(.schematest)으로
        # 바꾸세요. 안 바꾸면 아래 잠금장치가 막습니다.
        default: iCloud.com.helpnara.slowrich
        type: string
      allow_real:
        description: "진짜 컨테이너에 apply 하는 것을 확인함 (시험용에서 검증한 뒤에만)"
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudkit-schema
  cancel-in-progress: false

jobs:
  schema:
    name: ${{ inputs.action }} · ${{ inputs.container }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CKTool JS 는 공개 npm 에 있다. 사설 레지스트리가 필요 없다.
      - name: CKTool JS 설치
        working-directory: Tools/cloudkit
        run: npm install --no-audit --no-fund

      # 스키마 파일은 모델에서 만들어 낸다. 손으로 옮겨 적으면 빠뜨린다.
      - name: 모델에서 스키마 파일 만들기
        run: |
          python3 Tools/cloudkit/generate-ckdb.py > /tmp/slowrich.ckdb
          echo "레코드 타입 $(grep -c 'RECORD TYPE' /tmp/slowrich.ckdb) 개"
          # 커밋해 둔 것과 어긋나면 알려 준다 — 모델을 고치고 다시 안 만든 것이다.
          if ! diff -q /tmp/slowrich.ckdb Tools/cloudkit/slowrich.ckdb >/dev/null; then
            echo "::warning::커밋된 slowrich.ckdb 가 모델과 어긋납니다. 다시 만들어 커밋하세요."
            diff Tools/cloudkit/slowrich.ckdb /tmp/slowrich.ckdb || true
          fi

      - name: 실행
        working-directory: Tools/cloudkit
        env:
          CKTOOL_MGMT_TOKEN: ${{ secrets.CKTOOL_MGMT_TOKEN }}
          CK_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CK_CONTAINER_ID: ${{ inputs.container }}
          CK_ALLOW_REAL: ${{ inputs.allow_real }}
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            read)
              echo "── 팀 ──"
              node ck.mjs teams
              echo
              echo "── 컨테이너 ──"
              echo "⚠️ 이름이 비슷한 것이 여럿이면 엉뚱한 쪽을 보고 있기 쉽습니다."
              node ck.mjs containers
              echo
              echo "── ${{ inputs.container }} · Development 에 지금 있는 것 ──"
              # 403 "User doesn't have access to container or container does not
              # exist" 는 **컨테이너가 아직 없다**는 뜻일 때가 많다. 위 목록에
              # 그 이름이 있는지 먼저 보라.
              node ck.mjs export development || echo "(읽지 못했습니다 — 위 컨테이너 목록에 이 이름이 있는지 보세요)"
              echo
              echo "── ${{ inputs.container }} · Production 에 지금 있는 것 ──"
              node ck.mjs export production || echo "(읽지 못했습니다 — 위 컨테이너 목록에 이 이름이 있는지 보세요)"
              ;;
            validate)
              node ck.mjs validate /tmp/slowrich.ckdb
              ;;
            apply)
              node ck.mjs validate /tmp/slowrich.ckdb
              node ck.mjs apply /tmp/slowrich.ckdb
              echo
              echo "── 적용 뒤 Development 를 다시 읽어 확인 ──"
              node ck.mjs export development
              ;;
          esac

      - name: 다음에 할 일
        if: inputs.action == 'apply'
        run: |
          echo "::notice::Development 까지 끝났습니다. Production 으로 올리려면 https://icloud.developer.apple.com 에서 ${{ inputs.container }} 를 고르고 Schema → Deploy Schema Changes 를 누르세요."
