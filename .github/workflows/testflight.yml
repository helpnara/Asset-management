name: TestFlight 배포

# 맥 없이 아이폰에 앱을 올리는 경로다.
# macOS 러너가 빌드·서명·업로드를 대신하고, 사용자는 TestFlight 앱으로 설치한다.
#
# 처음 한 번은 docs/06-testflight.md 의 준비 절차를 마쳐야 한다.
# (Apple Developer Program 가입 · App Store Connect API 키 · 저장소 시크릿 4개)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "테스터에게 보여줄 변경 사항"
        required: false
        default: "주간 점검 루틴"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: 빌드 · 서명 · TestFlight 업로드
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # 애플은 2026년부터 **iOS 26 SDK(Xcode 26+)** 로 빌드한 바이너리만 받는다.
      # 러너 이미지에 Xcode 가 여러 개 깔려 있으므로 가장 높은 것을 고르고,
      # 26 미만이면 여기서 멈춘다 — 빌드·서명을 다 마친 뒤 업로드에서 409 를
      # 보는 것보다 낫다 (실제로 그렇게 한 번 돌았다).
      - name: Xcode 26 이상 선택
        run: |
          set -uo pipefail
          echo "── 설치된 Xcode ──"; ls -d /Applications/Xcode*.app 2>/dev/null || true

          # 버전은 plist 에서 읽는다. 선택되지 않은 Xcode 의 xcodebuild 를 직접
          # 실행하면 abort(SIGABRT) 하는 것이 섞여 있어서, 고르는 단계에서
          # 실행하면 안 된다.
          BEST=""; BEST_V=0
          for app in /Applications/Xcode*.app; do
            plist="$app/Contents/version.plist"
            [ -f "$plist" ] || continue
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null) || continue
            v=${v%%.*}
            case "$v" in ''|*[!0-9]*) continue ;; esac
            echo "  $app → $v"
            if [ "$v" -gt "$BEST_V" ]; then BEST_V="$v"; BEST="$app"; fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::러너에서 Xcode 를 찾지 못했습니다"
            exit 1
          fi
          if [ "$BEST_V" -lt 26 ]; then
            echo "::error::가장 높은 Xcode 가 $BEST_V 입니다. App Store Connect 는 iOS 26 SDK(Xcode 26+) 빌드만 받습니다 — runs-on 러너 이미지를 올려야 합니다."
            exit 1
          fi
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"


      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      # 깨진 계산이 아이폰까지 가면 안 된다. 20초짜리 관문이다.
      - name: 계산 로직 테스트
        run: cd Packages/Core && swift test

      - name: App Store Connect API 키 준비
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::시크릿 APP_STORE_CONNECT_KEY_P8 이 비어 있습니다. docs/06-testflight.md 를 보세요."
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$KEY" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 서명이 어긋나면 원인이 로그 깊숙이 묻힌다. 실제로 적용된 값을 찍어 둔다 —
      # 실패했을 때 여기부터 보면 된다.
      - name: 서명 설정 확인
        run: |
          xcodebuild -project SlowRich.xcodeproj -scheme SlowRich \
            -configuration Release -showBuildSettings 2>/dev/null \
            | grep -Ei 'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS' \
            || echo "(서명 관련 설정을 찾지 못했습니다)"

      # 아카이브는 자동 서명 + 클라우드 서명으로 굽는다.
      #
      # 여기까지 오는 데 다섯 번 틀렸다. 성립하는 조건이 셋이다:
      #  · API 키 액세스가 **Admin** 이어야 한다. App Manager 로는 서명 자산을
      #    만들 권한이 없어 "Communication with Apple failed" 가 난다
      #  · 스킴의 archive 액션 구성이 **Release** 여야 한다 (project.yml)
      #  · 팀에 **기기가 최소 하나 등록**돼 있어야 한다. 자동 서명은 아카이브를
      #    개발용 프로파일로 굽고(CODE_SIGN_IDENTITY 기본값이 `iPhone Developer`다),
      #    개발용 프로파일은 기기 없이는 발급되지 않는다. 배포용 서명은
      #    아래 '내보내기' 단계에서 다시 입혀진다
      #
      # 막다른 길로 확인된 것들 — 다시 시도하지 말 것:
      #  · CODE_SIGN_IDENTITY 를 배포용으로 강제 → 자동 서명과 "충돌"로 거부
      #  · CODE_SIGNING_ALLOWED=NO → ProcessProductPackaging 이 건너뛰어져
      #    entitlements 가 앱에 안 박힌다 (iCloud·푸시가 통째로 빠졌다)
      #  · CODE_SIGN_IDENTITY=- (애드혹) → "Ad Hoc code signing is not allowed
      #    with SDK 'iOS 18.5'"
      - name: 아카이브
        run: |
          set -o pipefail
          # 빌드 번호는 실행 번호를 쓴다. 같은 번호를 두 번 올릴 수 없으므로 자동 증가가 필요하다.
          xcodebuild archive \
            -project SlowRich.xcodeproj \
            -scheme SlowRich \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SlowRich.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            || {
              echo "::error::아카이브 실패. 'no devices from which to generate a provisioning profile' 라면 자동 서명이 개발용 프로파일을 요구하는 것입니다 — docs/06-testflight.md 의 '기기 등록' 절을 보세요."
              exit 1
            }

      # entitlements 가 **아카이브 시점에** 박혔는지 여기서 본다.
      # 여기서 없으면 아카이브 문제, 여기서 있는데 IPA 에서 없으면 내보내기 문제다.
      # 원인을 두 단계로 갈라 놓아야 다음에 헤매지 않는다.
      - name: 아카이브 entitlement 확인
        run: |
          set -euo pipefail
          APP=$(find build/SlowRich.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "── 아카이브의 entitlements ──"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENT"
          if ! printf '%s' "$ENT" | grep -q 'com.apple.developer.icloud-container-identifiers'; then
            echo "::error::아카이브 단계에서 이미 iCloud 자격이 빠졌습니다. CODE_SIGN_ENTITLEMENTS 설정을 보세요."
            exit 1
          fi
          echo "✅ 아카이브에 자격이 박혔습니다"

      - name: 내보내기 설정 만들기
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      # 여기서 애플 서버에 배포용 인증서와 App Store 프로파일을 만든다.
      # `Cloud signing permission error` 가 나면 코드 문제가 아니라 **API 키 권한**이다 —
      # 키 액세스가 `Admin` 이어야 한다 (App Manager 로는 서명 자산을 못 만든다).
      - name: IPA 내보내기 (여기서 배포용 서명)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/SlowRich.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            || {
              echo "::error::내보내기 실패. 'Cloud signing permission error' 라면 API 키 액세스가 Admin 이 아닙니다 — docs/06-testflight.md 5단계를 보세요."
              exit 1
            }
          ls -la build/export

      # 서명 없이 구운 아카이브를 내보내기에서 서명했으므로, **entitlement 가
      # 살아남았는지 여기서 확인한다.** iCloud 자격이 빠지면 앱은 설치되는데
      # 동기화만 조용히 안 된다 — 그게 이 앱에서 제일 위험한 실패다.
      # 업로드하기 전에 잡는다.
      - name: 서명 · entitlement 확인
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::IPA 를 찾지 못했습니다"; exit 1; }

          rm -rf build/check && mkdir -p build/check
          unzip -q "$IPA" -d build/check
          APP=$(find build/check/Payload -maxdepth 1 -name '*.app' | head -1)

          echo "── 서명 ──"
          codesign -dv "$APP" 2>&1 | grep -Ei 'Authority|TeamIdentifier|Signature' || true

          echo "── entitlements ──"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENT"

          missing=0
          for key in \
            "com.apple.developer.icloud-container-identifiers" \
            "com.apple.developer.icloud-services" \
            "aps-environment"
          do
            if ! printf '%s' "$ENT" | grep -q "$key"; then
              echo "::error::entitlement 누락: $key"
              missing=1
            fi
          done

          if printf '%s' "$ENT" | grep -q "<string>development</string>"; then
            echo "::error::aps-environment 가 development 입니다. TestFlight 빌드는 production 이어야 합니다."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::서명은 됐지만 자격이 어긋났습니다. 업로드를 중단합니다."
            exit 1
          fi
          echo "✅ 서명과 entitlement 정상"

      - name: TestFlight 업로드
        run: |
          IPA=$(find build/export -name '*.ipa' | head -1)
          echo "업로드: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: 업로드 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/export/
          if-no-files-found: warn

      - name: 안내
        run: |
          echo "빌드 ${{ github.run_number }} 를 TestFlight 에 올렸습니다."
          echo "애플이 처리하는 데 5~15분 걸립니다. TestFlight 앱에서 설치하세요."
          echo "변경 사항: ${{ inputs.notes }}"
          echo ""
          echo "처음이라면 docs/06-testflight.md 의 8~9단계(테스터 등록·설치)와"
          echo "'CloudKit 스키마 배포' 를 잊지 마세요."
