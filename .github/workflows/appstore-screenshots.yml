name: App Store 스크린샷 (6.9" · iPad 13")

# App Store 는 6.9" 아이폰(1320×2868)과, iPad 를 지원하면 13" iPad(2064×2752)
# 스크린샷을 요구한다. 평소 CI 는 가장 최신 iPhone 을 골라 찍으므로 그 크기가
# 아닐 수 있다. 이 워크플로는 **Pro Max 와 13" iPad Pro** 를 골라 제출용
# 크기로 찍고, `Tools/store/compose.py` 가 문장을 얹는다 (docs/10 §4 · 136번).
#
# 손으로 실행할 때만 돈다 (docs/07-app-store.md 4단계). 결과:
#   screenshots/appstore/iphone/  원본     screenshots/appstore/store/iphone/  문장 얹은 것
#   screenshots/appstore/ipad/    원본     screenshots/appstore/store/ipad/    문장 얹은 것

on:
  workflow_dispatch:

jobs:
  shoot:
    name: 제출용 스크린샷
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # 러너 이미지에 Xcode 가 여러 개 깔려 있다. TestFlight 로 올라가는 것과 같은
      # SDK 로 컴파일해야 여기서 통과한 코드가 배포에서도 통과한다.
      - name: 최신 Xcode 선택
        run: |
          set -uo pipefail

          # 러너가 기본으로 선택해 둔 Xcode 에만 시뮬레이터 런타임이 갖춰져 있다.
          # 그래서 **이미 26 이상이면 손대지 않는다.** 예전에 major 만 비교해
          # 다른 26.x 로 바꿨다가 "iOS 26.0 is not installed" 로 막혔다.
          xcver() {
            [ -f "$1/Contents/version.plist" ] || return 1
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$1/Contents/version.plist" 2>/dev/null
          }

          CUR_APP=$(xcode-select -p 2>/dev/null || true)
          CUR_APP=${CUR_APP%/Contents/Developer}
          CUR_V=$(xcver "$CUR_APP" || true)
          echo "현재 선택: ${CUR_APP:-(없음)} ${CUR_V:-(?)}"

          NEED=1
          case "${CUR_V%%.*}" in
            ''|*[!0-9]*) ;;
            *) [ "${CUR_V%%.*}" -ge 26 ] && NEED=0 ;;
          esac

          if [ "$NEED" -eq 1 ]; then
            echo "── 설치된 Xcode ──"
            BEST=""; BEST_K=0
            for app in /Applications/Xcode*.app; do
              v=$(xcver "$app" || true)
              [ -n "$v" ] || continue
              k=$(echo "$v" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
              echo "  $app → $v"
              if [ "$k" -gt "$BEST_K" ]; then BEST_K=$k; BEST="$app"; BEST_V="$v"; fi
            done
            if [ -n "$BEST" ]; then
              echo "전환: $BEST ($BEST_V)"
              sudo xcode-select -s "$BEST/Contents/Developer"
              CUR_V="$BEST_V"
            fi
          fi

          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "── 시뮬레이터 런타임 ──"; xcrun simctl list runtimes | grep -i ios || true


      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      - name: 6.9" 시뮬레이터 고르기
        id: sim
        run: |
          set -euo pipefail
          # Pro Max 만 본다. 다른 기종은 크기가 안 맞아 업로드에서 거부된다.
          read -r UDID NAME <<< "$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\d+)-(\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or 'Pro Max' not in name:
                      continue
                  n = re.match(r'iPhone (\d+)', name)
                  if not n:
                      continue
                  key = (version, int(n.group(1)))
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          if best is None:
              sys.exit('Pro Max 시뮬레이터를 찾지 못했습니다')
          print(best[1], best[2])
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "선택한 시뮬레이터: $NAME ($UDID)"

      - name: 빌드
        run: |
          set -o pipefail
          xcodebuild \
            -project SlowRich.xcodeproj \
            -scheme SlowRich \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 13" iPad 시뮬레이터 고르기
        id: ipad
        run: |
          set -euo pipefail
          read -r UDID NAME <<< "$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\d+)-(\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or 'iPad Pro' not in name or '13-inch' not in name:
                      continue
                  key = (version, name)
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          if best is None:
              sys.exit('13-inch iPad Pro 시뮬레이터를 찾지 못했습니다')
          print(best[1], best[2])
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "선택한 iPad: $NAME ($UDID)"

      - name: 찍기
        run: |
          BUNDLE=com.helpnara.slowrich
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          rm -rf screenshots/appstore
          mkdir -p screenshots/appstore/iphone screenshots/appstore/ipad

          prepare() {
            local udid="$1"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override \
              --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "$APP"
            # 첫 실행은 예열 — 앱이 앞으로 나오기 전에 찍히면 홈 화면이 남는다.
            xcrun simctl launch "$udid" "$BUNDLE" -skipOnboarding -seedSampleData >/dev/null 2>&1 || true
            sleep 8
            xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
          }

          shoot() {
            local udid="$1" file="$2"; shift 2
            local attempt size
            for attempt in 1 2 3; do
              xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
              xcrun simctl launch "$udid" "$BUNDLE" "$@" >/dev/null
              sleep 7
              xcrun simctl io "$udid" screenshot "$file"
              size=$(stat -f%z "$file")
              # 홈 화면(벽지)은 유난히 크고, 안 그려진 화면은 유난히 작다.
              if [ "$size" -lt 3500000 ] && [ "$size" -ge 200000 ]; then
                echo "찍음: $file"
                return 0
              fi
              echo "  다시 ($attempt/3): $size 바이트"
              sleep 4
            done
            echo "::error::$file — 세 번 찍었지만 화면이 이상합니다"
            exit 1
          }

          # 순서는 docs/10 §4 — ① 궤적 ② 주간 점검 ③ 가족 ④ 진단 ⑤ 서버 없음.
          # ① 은 현황판 카드 순서를 실행 인자로 바꿔 궤적을 맨 위에 둔다
          #    (`dashboard.cardOrder` 는 AppStorage 라 -키 값 인자로 덮인다).
          for DEV in iphone ipad; do
            if [ "$DEV" = iphone ]; then UDID="${{ steps.sim.outputs.udid }}"; else UDID="${{ steps.ipad.outputs.udid }}"; fi
            prepare "$UDID"
            OUT="screenshots/appstore/$DEV"
            shoot "$UDID" "$OUT/1-trajectory.png"  -skipOnboarding -seedSampleData -startTab dashboard -dashboard.cardOrder "trajectory,hero,roadmap,attribution,weekly,diary,monthly,lifeEvents,diagnostics,members,totals"
            shoot "$UDID" "$OUT/2-review.png"      -skipOnboarding -seedSampleData -startTab dashboard -startReview
            shoot "$UDID" "$OUT/3-family.png"      -skipOnboarding -seedSampleData -startTab assets -startFamilyAllocation
            shoot "$UDID" "$OUT/4-diagnostics.png" -skipOnboarding -seedSampleData -startTab more -startDiagnostics
            shoot "$UDID" "$OUT/5-no-server.png"   -skipOnboarding -seedSampleData -startTab more -scrollTo sync
            xcrun simctl shutdown "$UDID" || true
          done

      - name: 문장 얹기
        run: |
          pip3 install --quiet pillow
          python3 Tools/store/compose.py screenshots/appstore/iphone screenshots/appstore/store/iphone iphone
          python3 Tools/store/compose.py screenshots/appstore/ipad   screenshots/appstore/store/ipad   ipad
          echo "--- 크기 확인 (iPhone 1320×2868 · iPad 2064×2752) ---"
          for f in screenshots/appstore/store/*/*.png; do
            python3 -c "
          import struct
          with open('$f','rb') as fh:
              fh.read(16); w, h = struct.unpack('>II', fh.read(8))
          print('$f', f'{w}×{h}')
          "
          done

      - name: 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots/appstore
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git commit -m "chore: App Store 제출용 스크린샷 (6.9\" · iPad 13\") [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: screenshots/appstore/
