name: iOS 빌드 · 테스트 · 스크린샷

# 이 저장소는 Linux 원격 세션에서 개발되므로 여기서는 컴파일할 수 없다.
# 이 워크플로가 그 역할을 대신한다: 푸시할 때마다 macOS 러너에서 빌드하고,
# 시뮬레이터 스크린샷을 screenshots/ 에 커밋해 다음 세션이 눈으로 확인할 수 있게 한다.

on:
  push:
    branches: ["claude/**", main]
    paths-ignore:
      - "screenshots/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core 계산 로직 테스트
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 툴체인 확인
        run: |
          xcodebuild -version
          swift --version

      # **세 벌이 같은 것을 말하는지 본다.**
      #
      # 4차 1b-2 로 `@Model` 이 사라졌다. 이제 원본은 `.xcdatamodeld` 이고,
      # `@NSManaged` 선언과 CloudKit 스키마가 그것에서 파생된다. 생성기는
      # 한 번 쓰고 끝난 것이 아니라 **다시 뽑을 근거가 없어진 것**이라,
      # 여기서는 "다시 뽑아서 diff" 가 아니라 **파일 셋을 서로 대조**한다.
      # 잡는 것은 같다 — 오히려 생성기를 안 돌려도 잡는다.
      #
      # 왜 중요한가. 모델을 고치고 CloudKit 스키마를 안 올리면 **동기화가
      # 조용히 깨진다** — 새 필드를 Production 이 모르니 밀어 넣기가 실패하는데
      # 앱은 로컬에 잘 저장하니 화면은 멀쩡해 보인다. 그리고 `@NSManaged`
      # 선언이 빠지면 **컴파일도 통과한다** — 값 하나가 조용히 빌 뿐이다.
      - name: 모델 · CloudKit 스키마 · @NSManaged 가 서로 맞는지
        run: |
          python3 Tools/coredata/check-model-matches-ckdb.py
          python3 Tools/coredata/check-managed-matches-model.py
          echo "칸을 더했다면: .xcdatamodeld · Generated/ · slowrich.ckdb 셋을 함께 고치고,"
          echo "Actions → CloudKit 스키마 → apply 뒤 콘솔에서 Deploy Schema Changes 를 누르세요."

      # 애플 서버가 올린 뒤 메일로만 알려 주는 종류(ITMS-91056)를 올리기 전에
      # 잡는다. 키 이름 하나가 틀려서 두 빌드가 돌아온 적이 있다.
      - name: 개인정보 명세의 키와 값이 Xcode 정의와 맞는지
        run: python3 Tools/privacy/check-privacy-manifest.py

      - name: swift test
        working-directory: Packages/Core
        run: swift test --enable-code-coverage

  app:
    name: 앱 빌드 · 스크린샷
    runs-on: macos-26
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 스크린샷을 되돌려 커밋해야 하므로 푸시 가능한 체크아웃
          persist-credentials: true

      # 러너 이미지에 Xcode 가 여러 개 깔려 있다. TestFlight 로 올라가는 것과 같은
      # SDK 로 컴파일해야 여기서 통과한 코드가 배포에서도 통과한다.
      - name: 최신 Xcode 선택
        run: |
          set -uo pipefail

          # 러너가 기본으로 선택해 둔 Xcode 에만 시뮬레이터 런타임이 갖춰져 있다.
          # 그래서 **이미 26 이상이면 손대지 않는다.** 예전에 major 만 비교해
          # 다른 26.x 로 바꿨다가 "iOS 26.0 is not installed" 로 막혔다.
          xcver() {
            [ -f "$1/Contents/version.plist" ] || return 1
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$1/Contents/version.plist" 2>/dev/null
          }

          CUR_APP=$(xcode-select -p 2>/dev/null || true)
          CUR_APP=${CUR_APP%/Contents/Developer}
          CUR_V=$(xcver "$CUR_APP" || true)
          echo "현재 선택: ${CUR_APP:-(없음)} ${CUR_V:-(?)}"

          NEED=1
          case "${CUR_V%%.*}" in
            ''|*[!0-9]*) ;;
            *) [ "${CUR_V%%.*}" -ge 26 ] && NEED=0 ;;
          esac

          if [ "$NEED" -eq 1 ]; then
            echo "── 설치된 Xcode ──"
            BEST=""; BEST_K=0
            for app in /Applications/Xcode*.app; do
              v=$(xcver "$app" || true)
              [ -n "$v" ] || continue
              k=$(echo "$v" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
              echo "  $app → $v"
              if [ "$k" -gt "$BEST_K" ]; then BEST_K=$k; BEST="$app"; BEST_V="$v"; fi
            done
            if [ -n "$BEST" ]; then
              echo "전환: $BEST ($BEST_V)"
              sudo xcode-select -s "$BEST/Contents/Developer"
              CUR_V="$BEST_V"
            fi
          fi

          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "── 시뮬레이터 런타임 ──"; xcrun simctl list runtimes | grep -i ios || true

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      - name: 시뮬레이터 고르기
        id: sim
        run: |
          # 러너 이미지마다 있는 기기가 달라 이름을 박지 않는다.
          # 다만 SE·mini 는 화면이 좁아 설계 기준(390pt급)과 어긋나므로 제외한다.
          read -r UDID NAME <<< "$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          rank = {'': 3, ' Pro': 2, ' Plus': 1, ' Pro Max': 0}
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\\d+)-(\\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or not name.startswith('iPhone'):
                      continue
                  if 'SE' in name or 'mini' in name:
                      continue
                  n = re.match(r'iPhone (\\d+)(.*)$', name)
                  if not n:
                      continue
                  key = (version, int(n.group(1)), rank.get(n.group(2), 0))
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          if best is None:
              sys.exit('쓸 만한 iPhone 시뮬레이터를 찾지 못했습니다')
          print(best[1], best[2])
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "선택한 시뮬레이터: $NAME ($UDID)"

      - name: 빌드
        run: |
          set -o pipefail
          xcodebuild \
            -project SlowRich.xcodeproj \
            -scheme SlowRich \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # **모델 파일이 정말 컴파일됐는지 본다** (docs/09-family-sharing.md 1a).
      #
      # XcodeGen 이 `.xcdatamodeld` 를 소스가 아니라 리소스로 잡으면, 빌드는
      # 통과하는데 XML 이 그대로 번들에 복사될 뿐 아무도 안 읽는다. 그러면
      # 1a 가 하려던 일(컴파일러를 심판으로 세우기)이 통째로 헛것이 된다.
      # `momc` 를 거치면 `.momd` 가 나오므로, 그것이 있는지로 가른다.
      - name: Core Data 모델이 컴파일됐는지
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if [ ! -d "$APP/SlowRich.momd" ]; then
            echo "::error::$APP 안에 SlowRich.momd 가 없습니다 — 모델이 컴파일되지 않았습니다."
            echo "XcodeGen 이 .xcdatamodeld 를 소스가 아니라 리소스로 잡았을 수 있습니다."
            ls -la "$APP" | head -40
            exit 1
          fi
          echo "SlowRich.momd 확인 — 모델이 컴파일됩니다."

          # 개인정보 명세가 번들에 어떤 모양으로 들어갔는지. 애플이 ITMS-91056
          # (Invalid privacy manifest) 로 두 번 돌려보냈는데, 저장소의 파일은
          # 로컬 파서를 통과한다 — 그러니 번들 안의 실물을 봐야 한다.
          echo "── 개인정보 명세 ──"
          find "$APP" -name '*.xcprivacy' -print
          MANIFEST="$APP/PrivacyInfo.xcprivacy"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST 가 없습니다."
            exit 1
          fi
          file "$MANIFEST"
          plutil -lint "$MANIFEST"
          plutil -p "$MANIFEST"
          echo "── 원문(앞 400바이트) ──"
          head -c 400 "$MANIFEST" | cat -v; echo

      # **여기가 그 심판이다.**
      #
      # 파일 검사(check-model-matches-ckdb.py)도 momc 도 통과한 모델이 기기에서
      # 막힌 적이 있다 — 필수 UUID 열여섯 곳에 `defaultValueString` 이 적혀
      # 있는데 Core Data 가 UUID 에서는 그 글자를 안 읽어, 런타임의
      # `defaultValue` 가 nil 이었다. 파일을 들여다봐서는 안 보이는 종류다.
      #
      # 그래서 **컴파일된 모델을 진짜 Core Data 로 열어** 물어본다. 리눅스에서는
      # 못 하는 일이라 여기서만 할 수 있다. 앱이 쓰는 ModelDefaults 를 같이
      # 컴파일해서 그대로 부르므로, 검사기와 앱이 어긋날 수 없다.
      - name: 모델이 CloudKit 규칙에 맞는지 (진짜 런타임으로)
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          swiftc -O -parse-as-library \
            App/Persistence/ModelDefaults.swift \
            Tools/coredata/check-cloudkit-model.swift \
            -o /tmp/checkmodel
          /tmp/checkmodel "$APP/SlowRich.momd"

      - name: 시뮬레이터에서 화면별 스크린샷
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.helpnara.slowrich
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # 상태 바를 고정한다. 그러지 않으면 시계가 매 실행 달라져
          # 스크린샷이 항상 "변경됨"으로 판정되고 커밋이 무의미하게 쌓인다.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "설치: $APP"
          xcrun simctl install "$UDID" "$APP"

          # **앱이 왜 안 뜨는지 먼저 듣는다** (4차 1b-2).
          #
          # 스크린샷 고리는 "안 떴다" 만 말해 주고 이유는 안 말한다. 저장 계층을
          # 바꾼 뒤로는 그 이유가 대개 Core Data 쪽이라, 한 번은 콘솔을 붙여
          # 띄워 보고 표준 출력·오류를 그대로 남긴다. 앱이 살아 있으면 25초 뒤
          # 끊는다 (macOS 에는 `timeout` 이 없어 perl 의 alarm 을 쓴다).
          echo "── 콘솔을 붙여 한 번 띄워 본다 ──"
          perl -e 'alarm 25; exec @ARGV' \
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE" -localStoreOnly 2>&1 \
            | head -60 || true
          echo "── 여기까지 ──"
          xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true

          mkdir -p screenshots
          rm -f /tmp/shoot-failures

          # 앱을 켜기만 하면 빈 화면밖에 못 본다.
          # 가상 데이터를 시드하고 탭을 지정해 화면마다 한 장씩 찍는다.
          # 한 번 찍고 끝내면 안 된다. 실제로 이런 일이 있었다:
          #  · 앱이 안 떠서 **홈 화면**이 찍혔다 (04-review, 3.1MB)
          #  · 아직 안 그려져서 **흰 화면**이 찍혔다 (06-plan · 07-simulation · 13-principles)
          # 원격 세션에서는 이 그림이 앱을 확인하는 유일한 창구라, 못 찍은 것보다
          # **못 찍은 줄 모르는 것**이 훨씬 나쁘다. 그래서 두 가지를 확인하고
          # 아니면 다시 찍는다.
          shoot() {
            local file="$1"; shift
            local attempt pid size
            for attempt in 1 2 3; do
              xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
              pid=$(xcrun simctl launch "$UDID" "$BUNDLE" "$@" | awk '{print $NF}')
              sleep 7
              # (1) 앱이 살아 있나. 시뮬레이터 앱은 호스트의 프로세스라 여기서 보인다.
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "  앱이 떠 있지 않습니다 (pid $pid). 다시 ($attempt/3)"
                sleep 3
                continue
              fi
              xcrun simctl io "$UDID" screenshot "screenshots/$file"
              # (2) 아직 안 그려진 화면은 단색이라 PNG 가 유난히 작다.
              #     제일 단순한 실제 화면(01-empty)도 15만 바이트가 넘는다.
              size=$(stat -f%z "screenshots/$file")
              if [ "$size" -ge 120000 ]; then
                echo "찍음: $file ($*)"
                return 0
              fi
              echo "  빈 화면 같습니다 ($size 바이트). 다시 ($attempt/3)"
              sleep 3
            done
            echo "::error::$file — 세 번 찍었지만 화면이 비어 있습니다"
            # **못 찍은 것을 세어 둔다.** 예전에는 경고만 찍고 넘어가서,
            # 스물넷이 전부 빈 화면인데도 CI 가 초록이었다 (4차 1b-2).
            # 화면을 못 찍었다는 것은 대개 앱이 죽었다는 뜻이다.
            echo "$file" >> /tmp/shoot-failures
          }

          # 환영 화면은 첫 실행에만 뜬다. 나머지 장면은 -skipOnboarding 으로 건너뛴다.
          # 시드를 안 쓰는 두 장면은 실제 저장소를 연다. CI 빌드에는 iCloud
          # entitlement 가 없으므로 로컬 저장소로 명시해서 연다.
          shoot 00-welcome.png     -localStoreOnly
          shoot 01-empty.png       -localStoreOnly -skipOnboarding
          shoot 02-dashboard.png   -skipOnboarding -seedSampleData -startTab dashboard
          shoot 03-assets.png      -skipOnboarding -seedSampleData -startTab assets
          shoot 04-review.png      -skipOnboarding -seedSampleData -startTab dashboard -startReview
          shoot 05-review-done.png -skipOnboarding -seedSampleData -startTab dashboard -showReviewComplete
          shoot 06-plan.png        -skipOnboarding -seedSampleData -startTab plan
          shoot 07-simulation.png  -skipOnboarding -seedSampleData -startTab simulation
          shoot 08-more.png        -skipOnboarding -seedSampleData -startTab more
          shoot 09-history.png     -skipOnboarding -seedSampleData -startTab more -startHistory
          shoot 10-diagnostics.png -skipOnboarding -seedSampleData -startTab more -startDiagnostics
          shoot 11-todos.png       -skipOnboarding -seedSampleData -startTab more -startTodos
          # 키보드가 올라온 상태. `완료` 버튼이 **하나만** 뜨는지 보는 컷이다 —
          # 빌드 13 에서 필드 수만큼 네 개가 생겼다 (docs/08-feedback.md 2번).
          shoot 12-plan-keyboard.png -skipOnboarding -seedSampleData -startTab plan -focusMoneyField
          shoot 13-principles.png  -skipOnboarding -seedSampleData -startTab more -startPrinciples
          # 이번 묶음에서 가장 새롭고 계산이 많은 화면이다 (docs/08-feedback.md 14번).
          shoot 14-account-targets.png -skipOnboarding -seedSampleData -startTab assets -startAccountTargets
          shoot 15-family-allocation.png -skipOnboarding -seedSampleData -startTab assets -startFamilyAllocation
          # **1페이지는 한 장에 들어가느냐가 전부다.** 그런데 정작 이 화면만
          # 안 찍고 있어서 원칙을 몇 개 실을지, 종목을 몇 줄까지 둘지를 감으로
          # 정할 뻔했다 (docs/08-feedback.md 24번). 미리보기가 종이 끝 선과
          # 채움 비율을 함께 그린다.
          shoot 16-one-pager.png   -skipOnboarding -seedSampleData -startTab more -startOnePager
          # 되돌리기가 생겼다 (docs/08-feedback.md 40번). 되돌릴 수 없는 일이라
          # 경고 문구가 제대로 서는지 그림으로 본다.
          shoot 17-export.png      -skipOnboarding -seedSampleData -startTab more -startExport
          shoot 18-change-log.png  -skipOnboarding -seedSampleData -startTab more -startChangeLog

          # **보기 전용 화면** (docs/09-family-sharing.md 4단계). 아내분이 보게
          # 될 화면이라 원격 세션에서 그림으로 확인할 수 있어야 한다 — 고치는
          # 자리가 정말 사라졌는지, 남은 화면이 읽을 만한지.
          shoot 19-viewer-dashboard.png -skipOnboarding -seedSampleData -startTab dashboard -rolePreview viewer
          shoot 20-viewer-assets.png    -skipOnboarding -seedSampleData -startTab assets    -rolePreview viewer
          # **스크롤 아래 구역은 따로 찍어야 보인다.** 2b 에서 더보기에
          # "가족" 을 붙였는데 08-more 는 화면 맨 위만 담아서 심판이 못 봤다.
          shoot 22-family-share.png -skipOnboarding -seedSampleData -startTab more -scrollTo family
          shoot 21-viewer-plan.png      -skipOnboarding -seedSampleData -startTab plan      -rolePreview viewer

          # ── 다크 모드 ──
          # 라이트로만 찍어서 **화면마다 톤이 제각각인 것을 놓쳤다**
          # (docs/08-feedback.md 1번). 톤이 갈리던 화면을 골라 다시 찍는다:
          # 흰 배경을 칠하던 현황판·주간 점검, 안 칠하던 자산·계획,
          # 회색이 되던 시뮬레이션·진단, 그리고 잠금 화면.
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p screenshots/dark
          shoot dark/02-dashboard.png   -skipOnboarding -seedSampleData -startTab dashboard
          shoot dark/03-assets.png      -skipOnboarding -seedSampleData -startTab assets
          shoot dark/04-review.png      -skipOnboarding -seedSampleData -startTab dashboard -startReview
          shoot dark/06-plan.png        -skipOnboarding -seedSampleData -startTab plan
          shoot dark/07-simulation.png  -skipOnboarding -seedSampleData -startTab simulation
          shoot dark/08-more.png        -skipOnboarding -seedSampleData -startTab more
          shoot dark/10-diagnostics.png -skipOnboarding -seedSampleData -startTab more -startDiagnostics
          xcrun simctl ui "$UDID" appearance light

          ls -la screenshots screenshots/dark

          # 한 장이라도 못 찍었으면 막는다. 스크린샷은 이 저장소에서 앱이
          # 실제로 도는지 보는 유일한 창구라, 못 찍은 채 초록이면 그게 제일
          # 위험하다.
          if [ -s /tmp/shoot-failures ]; then
            echo "::error::못 찍은 화면 $(wc -l < /tmp/shoot-failures)장:"
            cat /tmp/shoot-failures
            echo "위의 '콘솔을 붙여 한 번 띄워 본다' 출력에 이유가 있습니다."
            exit 1
          fi
          echo "전부 찍었습니다."

      - name: 스크린샷을 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 새 스크린샷은 추적되지 않는 파일이라 git diff 로는 보이지 않는다.
          # 먼저 스테이지에 올린 뒤 --cached 로 비교해야 첫 커밋이 빠지지 않는다.
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "스크린샷 변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "chore: 시뮬레이터 스크린샷 갱신 (${{ steps.sim.outputs.name }}) [skip ci]"

          # 촬영은 7분쯤 걸린다. 그동안 사람이 브랜치에 뭔가 푸시하면 이 push 가
          # `[rejected] (fetch first)` 로 밀려서, **찍어 놓고도 못 올리는** 일이
          # 벌어진다. 실제로 두 번 그랬다. 리베이스하고 다시 민다.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "올렸습니다 (시도 $attempt)"
              exit 0
            fi
            echo "밀렸습니다. 원격을 당겨 리베이스하고 다시 시도합니다 ($attempt/3)"
            git fetch origin ${{ github.ref_name }}
            # 스크린샷은 러너가 새로 찍은 것이 항상 옳다. 충돌하면 우리 것을 쓴다.
            git rebase -X ours origin/${{ github.ref_name }} || {
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            }
            sleep $((attempt * 5))
          done
          echo "::error::스크린샷을 세 번 시도했지만 올리지 못했습니다."
          exit 1

      - name: 빌드 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
