name: iOS 빌드 · 테스트 · 스크린샷

# 이 저장소는 Linux 원격 세션에서 개발되므로 여기서는 컴파일할 수 없다.
# 이 워크플로가 그 역할을 대신한다: 푸시할 때마다 macOS 러너에서 빌드하고,
# 시뮬레이터 스크린샷을 screenshots/ 에 커밋해 다음 세션이 눈으로 확인할 수 있게 한다.

on:
  push:
    branches: ["claude/**", main]
    paths-ignore:
      - "screenshots/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core 계산 로직 테스트
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 툴체인 확인
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/Core
        run: swift test --enable-code-coverage

  app:
    name: 앱 빌드 · 스크린샷
    runs-on: macos-15
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 스크린샷을 되돌려 커밋해야 하므로 푸시 가능한 체크아웃
          persist-credentials: true

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      - name: 시뮬레이터 고르기
        id: sim
        run: |
          # 러너 이미지마다 있는 기기가 달라 이름을 박지 않는다.
          # 다만 SE·mini 는 화면이 좁아 설계 기준(390pt급)과 어긋나므로 제외한다.
          read -r UDID NAME <<< "$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          rank = {'': 3, ' Pro': 2, ' Plus': 1, ' Pro Max': 0}
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\\d+)-(\\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or not name.startswith('iPhone'):
                      continue
                  if 'SE' in name or 'mini' in name:
                      continue
                  n = re.match(r'iPhone (\\d+)(.*)$', name)
                  if not n:
                      continue
                  key = (version, int(n.group(1)), rank.get(n.group(2), 0))
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          if best is None:
              sys.exit('쓸 만한 iPhone 시뮬레이터를 찾지 못했습니다')
          print(best[1], best[2])
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "선택한 시뮬레이터: $NAME ($UDID)"

      - name: 빌드
        run: |
          set -o pipefail
          xcodebuild \
            -project SlowRich.xcodeproj \
            -scheme SlowRich \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 시뮬레이터에서 화면별 스크린샷
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.helpnara.slowrich
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # 상태 바를 고정한다. 그러지 않으면 시계가 매 실행 달라져
          # 스크린샷이 항상 "변경됨"으로 판정되고 커밋이 무의미하게 쌓인다.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "설치: $APP"
          xcrun simctl install "$UDID" "$APP"

          mkdir -p screenshots

          # 앱을 켜기만 하면 빈 화면밖에 못 본다.
          # 가상 데이터를 시드하고 탭을 지정해 화면마다 한 장씩 찍는다.
          shoot() {
            local file="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/$file"
            echo "찍음: $file ($*)"
          }

          shoot 00-empty.png
          shoot 01-dashboard.png -seedSampleData -startTab dashboard
          shoot 02-assets.png    -seedSampleData -startTab assets
          shoot 03-review.png    -seedSampleData -startTab dashboard -startReview

          ls -la screenshots

      - name: 스크린샷을 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 새 스크린샷은 추적되지 않는 파일이라 git diff 로는 보이지 않는다.
          # 먼저 스테이지에 올린 뒤 --cached 로 비교해야 첫 커밋이 빠지지 않는다.
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "스크린샷 변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "chore: 시뮬레이터 스크린샷 갱신 (${{ steps.sim.outputs.name }}) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: 빌드 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
