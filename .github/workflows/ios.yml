name: iOS 빌드 · 테스트 · 스크린샷

# 이 저장소는 Linux 원격 세션에서 개발되므로 여기서는 컴파일할 수 없다.
# 이 워크플로가 그 역할을 대신한다: 푸시할 때마다 macOS 러너에서 빌드하고,
# 시뮬레이터 스크린샷을 screenshots/ 에 커밋해 다음 세션이 눈으로 확인할 수 있게 한다.

on:
  push:
    branches: ["claude/**", main]
    paths-ignore:
      - "screenshots/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core 계산 로직 테스트
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 툴체인 확인
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/Core
        run: swift test --enable-code-coverage

  app:
    name: 앱 빌드 · 스크린샷
    runs-on: macos-26
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 스크린샷을 되돌려 커밋해야 하므로 푸시 가능한 체크아웃
          persist-credentials: true

      # 러너 이미지에 Xcode 가 여러 개 깔려 있다. TestFlight 로 올라가는 것과 같은
      # SDK 로 컴파일해야 여기서 통과한 코드가 배포에서도 통과한다.
      - name: 최신 Xcode 선택
        run: |
          set -uo pipefail

          # 러너가 기본으로 선택해 둔 Xcode 에만 시뮬레이터 런타임이 갖춰져 있다.
          # 그래서 **이미 26 이상이면 손대지 않는다.** 예전에 major 만 비교해
          # 다른 26.x 로 바꿨다가 "iOS 26.0 is not installed" 로 막혔다.
          xcver() {
            [ -f "$1/Contents/version.plist" ] || return 1
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$1/Contents/version.plist" 2>/dev/null
          }

          CUR_APP=$(xcode-select -p 2>/dev/null || true)
          CUR_APP=${CUR_APP%/Contents/Developer}
          CUR_V=$(xcver "$CUR_APP" || true)
          echo "현재 선택: ${CUR_APP:-(없음)} ${CUR_V:-(?)}"

          NEED=1
          case "${CUR_V%%.*}" in
            ''|*[!0-9]*) ;;
            *) [ "${CUR_V%%.*}" -ge 26 ] && NEED=0 ;;
          esac

          if [ "$NEED" -eq 1 ]; then
            echo "── 설치된 Xcode ──"
            BEST=""; BEST_K=0
            for app in /Applications/Xcode*.app; do
              v=$(xcver "$app" || true)
              [ -n "$v" ] || continue
              k=$(echo "$v" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
              echo "  $app → $v"
              if [ "$k" -gt "$BEST_K" ]; then BEST_K=$k; BEST="$app"; BEST_V="$v"; fi
            done
            if [ -n "$BEST" ]; then
              echo "전환: $BEST ($BEST_V)"
              sudo xcode-select -s "$BEST/Contents/Developer"
              CUR_V="$BEST_V"
            fi
          fi

          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "── 시뮬레이터 런타임 ──"; xcrun simctl list runtimes | grep -i ios || true

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      - name: 시뮬레이터 고르기
        id: sim
        run: |
          # 러너 이미지마다 있는 기기가 달라 이름을 박지 않는다.
          # 다만 SE·mini 는 화면이 좁아 설계 기준(390pt급)과 어긋나므로 제외한다.
          read -r UDID NAME <<< "$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          rank = {'': 3, ' Pro': 2, ' Plus': 1, ' Pro Max': 0}
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\\d+)-(\\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or not name.startswith('iPhone'):
                      continue
                  if 'SE' in name or 'mini' in name:
                      continue
                  n = re.match(r'iPhone (\\d+)(.*)$', name)
                  if not n:
                      continue
                  key = (version, int(n.group(1)), rank.get(n.group(2), 0))
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          if best is None:
              sys.exit('쓸 만한 iPhone 시뮬레이터를 찾지 못했습니다')
          print(best[1], best[2])
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "선택한 시뮬레이터: $NAME ($UDID)"

      - name: 빌드
        run: |
          set -o pipefail
          xcodebuild \
            -project SlowRich.xcodeproj \
            -scheme SlowRich \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 시뮬레이터에서 화면별 스크린샷
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.helpnara.slowrich
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # 상태 바를 고정한다. 그러지 않으면 시계가 매 실행 달라져
          # 스크린샷이 항상 "변경됨"으로 판정되고 커밋이 무의미하게 쌓인다.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "설치: $APP"
          xcrun simctl install "$UDID" "$APP"

          mkdir -p screenshots

          # 앱을 켜기만 하면 빈 화면밖에 못 본다.
          # 가상 데이터를 시드하고 탭을 지정해 화면마다 한 장씩 찍는다.
          shoot() {
            local file="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/$file"
            echo "찍음: $file ($*)"
          }

          # 환영 화면은 첫 실행에만 뜬다. 나머지 장면은 -skipOnboarding 으로 건너뛴다.
          # 시드를 안 쓰는 두 장면은 실제 저장소를 연다. CI 빌드에는 iCloud
          # entitlement 가 없으므로 로컬 저장소로 명시해서 연다.
          shoot 00-welcome.png     -localStoreOnly
          shoot 01-empty.png       -localStoreOnly -skipOnboarding
          shoot 02-dashboard.png   -skipOnboarding -seedSampleData -startTab dashboard
          shoot 03-assets.png      -skipOnboarding -seedSampleData -startTab assets
          shoot 04-review.png      -skipOnboarding -seedSampleData -startTab dashboard -startReview
          shoot 05-review-done.png -skipOnboarding -seedSampleData -startTab dashboard -showReviewComplete
          shoot 06-plan.png        -skipOnboarding -seedSampleData -startTab plan
          shoot 07-simulation.png  -skipOnboarding -seedSampleData -startTab simulation
          shoot 08-more.png        -skipOnboarding -seedSampleData -startTab more
          shoot 09-history.png     -skipOnboarding -seedSampleData -startTab more -startHistory
          shoot 10-diagnostics.png -skipOnboarding -seedSampleData -startTab more -startDiagnostics
          shoot 11-todos.png       -skipOnboarding -seedSampleData -startTab more -startTodos

          # ── 다크 모드 ──
          # 라이트로만 찍어서 **화면마다 톤이 제각각인 것을 놓쳤다**
          # (docs/08-feedback.md 1번). 톤이 갈리던 화면을 골라 다시 찍는다:
          # 흰 배경을 칠하던 현황판·주간 점검, 안 칠하던 자산·계획,
          # 회색이 되던 시뮬레이션·진단, 그리고 잠금 화면.
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p screenshots/dark
          shoot dark/02-dashboard.png   -skipOnboarding -seedSampleData -startTab dashboard
          shoot dark/03-assets.png      -skipOnboarding -seedSampleData -startTab assets
          shoot dark/04-review.png      -skipOnboarding -seedSampleData -startTab dashboard -startReview
          shoot dark/06-plan.png        -skipOnboarding -seedSampleData -startTab plan
          shoot dark/07-simulation.png  -skipOnboarding -seedSampleData -startTab simulation
          shoot dark/08-more.png        -skipOnboarding -seedSampleData -startTab more
          shoot dark/10-diagnostics.png -skipOnboarding -seedSampleData -startTab more -startDiagnostics
          xcrun simctl ui "$UDID" appearance light

          ls -la screenshots screenshots/dark

      - name: 스크린샷을 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 새 스크린샷은 추적되지 않는 파일이라 git diff 로는 보이지 않는다.
          # 먼저 스테이지에 올린 뒤 --cached 로 비교해야 첫 커밋이 빠지지 않는다.
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "스크린샷 변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "chore: 시뮬레이터 스크린샷 갱신 (${{ steps.sim.outputs.name }}) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: 빌드 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
